name: Build and Release Debian Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        uses: taiki-e/install-action@cargo-deb

      - name: Run cargo test
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Package .deb with cargo-deb
        run: cargo deb --no-build

      - name: Inspect generated package
        run: |
          for f in target/debian/*.deb; do
            echo "=== Package info for $f ==="
            dpkg-deb --info "$f"
            echo "=== Package contents for $f ==="
            dpkg-deb --contents "$f"
            break
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: target/debian/*.deb

      - name: Create GitHub Release and Upload .deb Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb
          generate_release_notes: true
